spring.application.name=ExpenseTracker

# Database (values come from environment variables in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expensetracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Aiven's free tier caps concurrent connections, so keep the pool small
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Render injects PORT and expects the app to bind to it
server.port=${PORT:8080}

# Comma separated list of origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
